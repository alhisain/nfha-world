<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Mechanical Gear / Laser Ring Background -->
  <g transform="translate(256, 256)" opacity="0.15">
    <circle r="180" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="16 12"/>
    <circle r="140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8"/>
  </g>

  <!-- Central Gear Shape -->
  <g transform="translate(256, 220)">
    <!-- Industrial Hexagon/Nut -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
    <circle r="42" fill="none" stroke="url(#cyanGrad)" stroke-width="10"/>
    
    <!-- Laser Beam Cross -->
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="120" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="-120" x2="0" y2="-60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="0" y2="120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Spark Center -->
    <circle r="12" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Typography: NFHA MANAGE -->
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">NFHA</text>
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="8">MANAGE</text>
</svg>
